          ],
          a: [
            113.3, 111.3, 109.1, 106.7, 104.2, 101.6, 98.9, 96.1, 93.2, 90.2,

            11.2, 10.2, 9.2, 8.3, 7.4, 6.6, 5.8, 5.1, 4.4, 3.8, 3.2, 2.7, 2.3,
            1.8, 1.4, 1.1, 0.8, 0.5, 0.3, 0.1, -0.1, -0.2, -0.3, -0.4, -0.4,
            -0.4, -0.4, -0.4, -0.4, -0.3, -0.2, -0.1, 0.0, 0.1, 0.3, 0.4, 0.6,
            0.8, 0.9, 1.1, 1.3, 1.5, 1.6, 1.8, 2.0, 2.2,
          ],
        },
        cx: 234.0,
        cy: 107.0,
        sw: 1.97,
      };
      const VX = 150,
        VY = 44,
        VW = 160,
        VH = 126;
      const INK = "#111111";
      const BAR_L = 90,
        BAR_R = 276,
        BAR_T = 63,
        BAR_B = 149; // bar at rest
      const HOVER_OFF = [0, 0]; // the white bar stays still; only the plane moves

      // ---- monotone cubic interpolation ----
      function curve(pts) {
        const n = pts.length,
          xs = pts.map((p) => p[0]),
          ys = pts.map((p) => p[1]);
        const d = [],
          m = new Array(n);
        for (let i = 0; i < n - 1; i++)
          d[i] = (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);
        m[0] = d[0];
        m[n - 1] = d[n - 2];
        for (let i = 1; i < n - 1; i++)
          m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
        for (let i = 0; i < n - 1; i++) {
          if (d[i] === 0) {
            m[i] = 0;
            m[i + 1] = 0;
            continue;
          }
          const a = m[i] / d[i],
            b = m[i + 1] / d[i],
            s = a * a + b * b;
          if (s > 9) {
            const t = 3 / Math.sqrt(s);
            m[i] = t * a * d[i];
            m[i + 1] = t * b * d[i];
          }
        }
        return (x) => {
          if (x <= xs[0]) return ys[0];
          if (x >= xs[n - 1]) return ys[n - 1];
          let lo = 0,
            hi = n - 1;
          while (hi - lo > 1) {
            const mid = (lo + hi) >> 1;
            if (xs[mid] <= x) lo = mid;
            else hi = mid;
          }
          const h = xs[hi] - xs[lo],
            t = (x - xs[lo]) / h,
            t2 = t * t,
            t3 = t2 * t;
          return (
            (2 * t3 - 3 * t2 + 1) * ys[lo] +
            (t3 - 2 * t2 + t) * h * m[lo] +
            (-2 * t3 + 3 * t2) * ys[hi] +
            (t3 - t2) * h * m[hi]
          );
        };
      }
      // bar motion while entering / leaving (seconds from the start of each move)
      const IN_X = () => 0;
      const IN_Y = () => 0;
      const OUT_X = () => 0;
      const OUT_Y = () => 0;
      const OUT_DUR = 0.3;

      // plane flight tables: F1 (leaves through the right edge), F2 (re-enters from the bottom and lands)
      function sample(P, t) {
        const f = (t - P.t0) / P.dt,
          i = Math.floor(f),
          u = f - i,
          n = P.x.length;
        if (i < 0 || i >= n - 1) return null;
        return {
          x: P.x[i] + (P.x[i + 1] - P.x[i]) * u,
          y: P.y[i] + (P.y[i + 1] - P.y[i]) * u,
          a: P.a[i] + (P.a[i + 1] - P.a[i]) * u,
        };
      }
      const REST = [D.cx, D.cy]; // plane at rest (bar at rest)
      const T_F1 = [0.6, 1.66],
        T_F2 = [1.72, 2.7],
        T_END = 2.7; // in video time; entering starts at 0.6

      // ---- drawing ----
      const cv = document.getElementById("c"),
        ctx = cv.getContext("2d");
      let k = 1;
      function resize() {
        const r = cv.getBoundingClientRect(),
          dpr = window.devicePixelRatio || 1;
        cv.width = Math.round(r.width * dpr);
        cv.height = Math.round(r.height * dpr);
        k = cv.width / VW;
      }
      addEventListener("resize", resize);
      resize();

      function drawPlane(x, y, aDeg) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((-aDeg * Math.PI) / 180);
        ctx.strokeStyle = INK;
        ctx.lineWidth = D.sw;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        for (const c of D.chains) {
          ctx.beginPath();
          ctx.moveTo(c[0], c[1]);
          for (let i = 2; i < c.length; i += 2) ctx.lineTo(c[i], c[i + 1]);
          ctx.stroke();
        }
        ctx.restore();
      }

      // ---- state ----
      let state = "idle",
        t = 0,
        wantHover = false,
        last = null;
      let leave = { off: [0, 0], plane: null };
      let barOff = [0, 0],
        plane = { x: REST[0], y: REST[1], a: 0, vis: true };

      function setHover(on) {
        wantHover = on;
        if (on && state === "idle") {
          state = "entering";
          t = 0;
        } else if (!on && (state === "entering" || state === "hover")) {
          state = "leaving";
          t = 0;
          leave = {
            off: barOff.slice(),
            plane: plane.vis
              ? {
                  x: plane.x,
                  y: plane.y,
                  a: (((plane.a % 360) + 540) % 360) - 180,
                }
              : null,
          };
        }
      }
      cv.addEventListener("pointerenter", () => setHover(true));
      cv.addEventListener("pointerleave", () => setHover(false));
      cv.addEventListener("pointercancel", () => setHover(false));

      function frame(ms) {
        const dt = last === null ? 0 : Math.min((ms - last) / 1000, 0.05);
        last = ms;
        if (state === "entering") {
          t += dt;
          if (t >= T_END - 0.6) {
            state = "hover";
          }
        } else if (state === "leaving") {
          t += dt;
          if (t >= OUT_DUR) {
            state = "idle";
            if (wantHover) setHover(true);
          }
        }

        if (state === "idle") {
          barOff = [0, 0];
          plane = { x: REST[0], y: REST[1], a: 0, vis: true };
        } else if (state === "entering" || state === "hover") {
          const tt = Math.min(t, 2.1);
          barOff = [IN_X(tt), IN_Y(tt)];
          const vt = 0.6 + tt; // video time
          let s = null;
          if (state === "hover" || vt >= T_F2[1])
            s = { x: REST[0] + HOVER_OFF[0], y: REST[1] + HOVER_OFF[1], a: 0 };
          else if (vt >= T_F2[0]) s = sample(D.F2, vt);
          else if (vt <= T_F1[1]) s = sample(D.F1, vt);
          plane = s
            ? { x: s.x, y: s.y, a: s.a, vis: true }
            : { x: 0, y: 0, a: 0, vis: false };
        } else {
          // leaving
          const e = Math.min(t, OUT_DUR);
          barOff = [(leave.off[0] * OUT_X(e)) / 1, leave.off[1] * OUT_Y(e)];
          const tx = REST[0] + barOff[0],
            ty = REST[1] + barOff[1];
          if (leave.plane) {
            const p = Math.min(1, t / OUT_DUR),
              q = p * p * (3 - 2 * p);
            plane = {
              x: leave.plane.x + (tx - leave.plane.x) * q,
              y: leave.plane.y + (ty - leave.plane.y) * q,
              a: leave.plane.a * (1 - q),
              vis: true,
            };
          } else plane = { x: tx, y: ty, a: 0, vis: t > OUT_DUR * 0.6 };
        }

        ctx.setTransform(k, 0, 0, k, -VX * k, -VY * k);
        ctx.clearRect(VX, VY, VW, VH);
        if (plane.vis) {
          drawPlane(plane.x, plane.y, plane.a);
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
